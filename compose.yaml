services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mesadj}
      POSTGRES_USER: ${DB_USER:-mesadj}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?crie o arquivo .env a partir do .env.example}
    volumes:
      - dados-mesadj:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # sem "ports": o banco só é acessível pela rede interna do compose

  api:
    build: .
    image: mesadj:local
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-mesadj}
      DB_USER: ${DB_USER:-mesadj}
      DB_PASSWORD: ${DB_PASSWORD}
      MESA_LIMITE_INSTRUMENTOS: ${MESA_LIMITE_INSTRUMENTOS:-8}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dados-mesadj:
