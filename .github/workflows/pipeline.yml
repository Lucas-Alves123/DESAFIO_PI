name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mesadj

jobs:
  testes:
    name: build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # unitários (surefire) + integração e aceitação com Postgres via Testcontainers (failsafe)
      - name: mvn verify
        run: mvn -B verify

      - name: relatórios dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/cucumber-report.html

  imagem:
    name: imagem docker
    needs: testes
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: nome da imagem em minúsculo
        id: tag
        run: |
          img=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "img=$img" >> "$GITHUB_OUTPUT"
          echo "tag=$img:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # em PR só builda (garante que o Dockerfile funciona); em push na main publica
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.tag.outputs.tag }}
            ${{ steps.tag.outputs.img }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy no Render
    needs: imagem
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: producao
      url: ${{ vars.APP_URL }}
    steps:
      # o serviço no Render é ligado ao repositório Git: o hook faz o build do commit que passou nos testes
      - name: dispara o deploy no Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "secret RENDER_DEPLOY_HOOK_URL não configurado"; exit 1; fi
          curl -fsS -X POST "$HOOK"

      - name: espera a aplicação responder (smoke test)
        if: vars.APP_URL != ''
        run: |
          for i in $(seq 1 40); do
            if curl -fsS "${{ vars.APP_URL }}/actuator/health" | grep -q '"UP"'; then
              echo "no ar"; exit 0
            fi
            sleep 15
          done
          echo "a aplicação não respondeu depois do deploy"; exit 1
